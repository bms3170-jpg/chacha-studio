<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 | 차차네점빵</title><link rel="stylesheet" href="style.css"></head><body class="admin-body" data-page="admin"><div class="admin-shell"><aside class="admin-side"><div class="admin-brand"><img src="images/logo.PNG"><div><strong>CHACHA ADMIN</strong><div style="font-size:9px;color:#999">운영센터 프로토타입</div></div></div><nav id="adminNav"><button class="active" data-panel="dashboard">대시보드</button><button data-panel="orders">주문·환불</button><button data-panel="products">상품관리</button><button data-panel="coupons">쿠폰관리</button><button data-panel="settings">홈페이지설정</button></nav></aside><main class="admin-main"><div class="admin-top"><h1>관리자 페이지</h1><a href="index.html">사이트 보기 →</a></div><div class="admin-cards" id="adminStats"></div><section class="admin-panel active" id="panel-dashboard"><div class="admin-box"><h2>실시간 운영 현황</h2><p class="admin-note">같은 브라우저에서 주문이 생성되거나 환불요청/상태가 변경되면 자동으로 갱신됩니다. 실제 기기 간 실시간 동기화는 Supabase Realtime 연결 단계에서 그대로 확장할 수 있습니다.</p></div><div class="admin-box"><h2>최근 알림</h2><div id="adminAlerts"></div></div></section><section class="admin-panel" id="panel-orders"><div class="admin-box"><h2>주문 · 환불 관리</h2><div id="adminOrders"></div></div></section><section class="admin-panel" id="panel-products"><div class="admin-box"><h2>상품 관리</h2><div id="adminProducts"></div><p class="admin-note">상품명·가격·대표상품 여부를 수정할 수 있습니다. 이미지 업로드와 전체 사이트 영구 반영은 Supabase Storage 연결 후 관리자에서 처리하도록 확장합니다.</p></div></section><section class="admin-panel" id="panel-coupons"><div class="admin-box"><h2>쿠폰 만들기</h2><form class="admin-form" id="couponForm"><label>쿠폰명<input name="name" required placeholder="웰컴 쿠폰"></label><label>쿠폰코드<input name="code" required placeholder="WELCOME2000"></label><label>할인방식<select name="type"><option value="fixed">정액 할인</option><option value="percent">정률 할인</option></select></label><label>할인값<input name="value" type="number" required value="2000"></label><label>최소 주문금액<input name="min" type="number" value="0"></label><label>최대 할인금액<input name="max" type="number" value="0"></label><button>쿠폰 저장</button></form><div id="couponList"></div></div></section><section class="admin-panel" id="panel-settings"><div class="admin-box"><h2>홈페이지 설정</h2><form class="admin-form" id="settingsForm"><label class="full">상단 공지<input name="notice" placeholder="배송 및 이벤트 공지"></label><label>기본 배송비<input name="shipping" type="number" value="3000"></label><label>도서산간 추가<input name="remote" type="number" value="5000"></label><label>택배사<input name="courier" value="한진택배"></label><label>발송 안내<input name="lead" value="영업일 5일 이내 발송"></label><button>설정 저장</button></form></div></section></main></div><script src="products.js"></script><script src="script.js"></script></body></html>
